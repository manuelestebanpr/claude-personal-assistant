# Telemetry tuning shared by every way of running the app.
#
# It lives outside application.properties because src/test/resources/application.properties
# *shadows* the main one rather than merging with it: target/test-classes precedes
# target/classes on the classpath and Boot resolves classpath:/application.properties to the
# first match only. So spring-boot:test-run — the mode whose entire purpose is a Grafana full of
# this application's telemetry — silently ran on defaults. Both application.properties files
# import this file, so the settings below cannot drift between run modes.
#
# Each line here exists because its default silently produces an empty or wrong Grafana.

# Boot samples 10% of traces by default, which leaves Tempo looking broken on a single-user app.
management.tracing.sampling.probability=1.0

# The 1m default means no metric renders for a full minute after boot; 15s keeps the dashboards
# responsive without meaningfully more traffic at this volume.
management.otlp.metrics.export.step=15s

# Timers publish a single +Inf bucket unless a histogram is requested. Measured: 69 buckets with
# these lines, 1 without — histogram_quantile() over one bucket is not empty, it is meaningless,
# so every p95 panel (ours and the ones the otel-lgtm image ships) quietly reads nonsense.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.app.module.operation=true
management.metrics.distribution.percentiles-histogram.mcp.tool=true

# Asking for a histogram is not enough: Micrometer's AbstractTimerBuilder caps the bucket range at
# DEFAULT_MAXIMUM_EXPECTED_DURATION = 30s, so a streamed turn — which spring.mvc.async
# .request-timeout deliberately allows 5m for — falls into the last bucket and every p95 panel over
# the streaming endpoint sits pinned at ~30000 ms forever. Not empty, confidently WRONG, which is
# the harder failure to notice. PropertiesMeterFilter reads these as Durations for TIMER meters and
# matches by dot-separated name prefix, so app.module.operation covers every module's boundary timer.
management.metrics.distribution.maximum-expected-value.http.server.requests=5m
management.metrics.distribution.maximum-expected-value.app.module.operation=5m
# Deliberately not mcp.tool: a tool call is a short local round trip, so 30s is the right ceiling
# there and widening it would only cost bucket cardinality for range nothing ever reaches.

# Boot 4.1 installs the context-propagating TaskDecorator only behind this opt-in —
# TaskExecutorConfigurations$TaskExecutorContextPropagationConfiguration is conditional on this
# property with havingValue="true" and no matchIfMissing, so it defaults to off. MVC async is bound
# to applicationTaskExecutor by WebMvcAutoConfigurationAdapter.configureAsyncSupport and
# ChatStreamController hands the entire assistant call to a StreamingResponseBody, so without this
# the observation scope does not cross onto the task thread: one chat turn arrives in Tempo as THREE
# unrelated root traces, every log line emitted on a task-N thread (content-block transitions, token
# usage, tool audits) carries no trace_id so the Tempo->Loki pivot finds nothing, and streamTurn /
# assistant.stream get zero exemplars. Needs no dependency: io.micrometer:context-propagation is
# already compile-scope and micrometer-observation registers ObservationThreadLocalAccessor through
# META-INF/services.
spring.task.execution.propagate-context=true

# Nothing produces a service.instance.id on its own, and the otel-lgtm image's prometheus.yaml
# promotes that resource attribute to the Prometheus 'instance' label — so without it every series
# carries an empty 'instance' and the image's own shipped dashboards render blank.
# It has to be set HERE, not through the standard OTEL_RESOURCE_ATTRIBUTES env var, because that
# var only reaches two of the three signals: measured against a live stack, it populated
# resource.service.instance.id on Tempo spans and service_instance_id on Loki records while
# Prometheus target_info for this job stayed bare — the Micrometer OTLP registry builds its own
# resource and never reads it. This Boot property feeds the shared Resource bean, so metrics,
# traces and logs agree on one value. A single-user app runs one instance; override the placeholder
# per instance if that ever stops being true.
# Bracket notation is required, not stylistic: the value is bound into a Map<String, String> and the
# key itself contains dots, which the relaxed binder would otherwise read as further nesting.
management.opentelemetry.resource-attributes[service.instance.id]=${OTEL_SERVICE_INSTANCE_ID:cpa-1}

# --- Log levels: these are EXPORT decisions, not just console ones ---
# OpenTelemetryLoggingBridge attaches the OTLP appender to the ROOT logger with no filter, so every
# record that survives its level threshold is shipped to Loki and retained there for 31 days. Until
# this block existed there was not one logging.level.* entry in the project: root sat at Boot's INFO
# default and the entire framework startup went to the backend. Measured on a real boot with the
# logger name unabbreviated: 41 lines before the first request, 36 of them framework. Every one of
# those 36 came from exactly the four prefixes below — org.springframework (Boot, Data, ORM,
# Modulith, Web), org.hibernate, com.zaxxer.hikari and org.apache (Catalina) — and no dashboard
# panel queries any of them.
# WARN rather than OFF on purpose: a framework problem still has to be visible. What is dropped is
# the routine "started/initialized/completed" narration, not diagnostics. Re-measured after: 41
# startup lines became 6 (measured before the Modulith exemption below, which adds back whatever
# that tree emits), and all five of this application's own lines survived — including
# "Started ClaudePersonalAssistantApplication in N seconds", which is the one people watch for.
# Boot's "Tomcat started on port(s)" goes with the rest; the port is in the launch command anyway.
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache=WARN
# One deliberate exemption from the line above, and it is not narration. Spring Modulith's
# DefaultEventPublicationRegistry logs "Marking stale publications … as failed", "Error republishing
# event publication …" and "Shutting down with the following publications left unfinished:" at INFO,
# and that first line is the ONLY symptom of this project's documented silent-drop bug: an
# @ApplicationModuleListener publish with no transaction in scope writes the registry row, never runs
# the listener, and moves no counter. application.properties turns the matching machinery on
# (republish-outstanding-events-on-restart, staleness.processing=10m), so discarding its one output
# would leave a dropped event with no trace at all — in the console or in Loki. A more specific
# logger name wins over the parent, so this restores exactly that tree and nothing else.
logging.level.org.springframework.modulith=INFO
# This application's own tree stays at INFO: its ~50 log.atInfo().addKeyValue(...) call sites are
# the structured facts the Loki panels and the Tempo->Loki pivot are built on. Silencing this tree
# would empty the dashboards, which is the opposite of the point.
logging.level.com.my.custom.claudepersonalassistant=INFO

# --- Anthropic / Spring AI observation settings ---
# Here rather than in application.properties because they are run-mode agnostic and the test
# classpath shadows that file entirely: under spring-boot:test-run — the mode whose whole purpose is
# a Grafana full of this application's telemetry — they would otherwise be lost.
# SDK-internal retries; spring.ai.retry.* does not apply to Anthropic in Spring AI 2.0.
spring.ai.anthropic.max-retries=3

# These two do NOT put content on the gen_ai span, which is what an earlier comment here claimed.
# Verified in spring-ai-model-2.0.0 bytecode: ChatModelPromptContentObservationHandler and
# ChatModelCompletionObservationHandler implement onStop() only, and each body is nothing but
# logger.isInfoEnabled() guarding a single logger.info(...). They contribute no KeyValue, no
# high-cardinality tag, no span attribute — they are log emitters wearing an ObservationHandler
# interface. So the only thing enabling them bought was two extra INFO lines per turn.
# Those lines are also the largest producer in the pipeline: chat.context-window-size=0 replays the
# FULL history every turn, so the prompt line re-logs the entire transcript on every message and
# grows with the conversation until it crosses Loki's max_line_size and the entry is dropped whole.
# And it is a privacy surface — Spring AI says so itself at startup: "You have enabled logging out
# the prompt content with the risk of exposing sensitive or private information."
# The turn is already fully reconstructible from the H2 message table and the gen_ai span, so this
# costs no observability.
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false

# A SECOND, independent switch family, trivially confused with the three above: these live on
# ChatClientBuilderProperties$Observations (spring.ai.chat.client.observations) rather than
# ChatObservationProperties (spring.ai.chat.observations), and they gate the ChatClient layer's own
# content logging. Both default to false; stated explicitly so the pair above cannot be turned back
# on without someone noticing there is another pair that does the same thing one layer up.
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false

# Registers ErrorLoggingObservationHandler, which is the THIRD log line for one assistant failure —
# after the assistant module's own ContentBlockLogger and after AssistantErrorAuditor. logs.json's
# "Error log rate" panel counts lines, so one failure read as two or three. AssistantErrorAuditor is
# kept as the single error line because it is the one that also increments
# assistant_stream_errors_total, so it is the line the dashboards can correlate against a metric.
spring.ai.chat.observations.include-error-logging=false

# The one content switch worth turning ON, because it writes to spans rather than to logs: it adds
# spring.ai.tool.call.arguments and spring.ai.tool.call.result to the execute_tool span Spring AI
# already creates, for no code at all. A span is the right surface for a payload — it is sampled,
# attached to the turn that caused it, and expires with the trace, whereas the same bytes in Loki
# are an unindexed 31-day copy. Defaults to false, so this line is what makes tool arguments
# visible in Tempo when a tool call goes wrong.
# It buys one permanent startup WARN from ToolCallingAutoConfiguration ("You have enabled the
# inclusion of the tool call arguments and result in the observations…"). That line is the opt-in
# being acknowledged, not a problem — and it is also the cheapest confirmation that this property
# still binds, since the two prompt/completion warnings it replaced disappeared with the switches
# above.
spring.ai.tools.observations.include-content=true
