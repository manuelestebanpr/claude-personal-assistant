spring.application.name=claude-personal-assistant

# This file shadows src/main/resources/application.properties (test-classes precedes classes on
# the classpath, and Boot takes the first classpath:/application.properties it finds) rather than
# merging with it, so everything the app needs must be reachable from here. The shared telemetry
# tuning is imported; the export switches below stay off for JUnit and are turned back on by
# TestClaudePersonalAssistantApplication for spring-boot:test-run.
spring.config.import=optional:file:.env[.properties],classpath:observability.properties,classpath:pricing.properties

# A real key when .env has one, the dummy otherwise — not the literal it used to be.
# spring-boot:test-run resolves the TEST runtime classpath, so this file shadows the main one and
# never saw .env: the documented "dev with the observability stack" mode therefore 401ed on every
# streamed turn. That failure impersonates a telemetry failure, which is why it survived so long:
# AnthropicErrorClassifier maps 401 to TERMINAL, ChatClientAssistant never reaches onComplete() on a
# throw, and ContentBlockLogger only increments assistant.tokens from onComplete() — so the token
# panel, the gen_ai spans and the "stream completed" Loki line stay permanently empty while
# assistant_stream_errors_total climbs, reading as "Grafana is broken" rather than "auth is broken".
# CI has no .env and still gets test-api-key; the suite mocks AssistantClient/ChatModel anyway, and
# google.workspace.enabled is not referenced from this file, so a .env cannot switch Google on here.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:test-api-key}
spring.ai.anthropic.chat.model=claude-haiku-4-5
spring.ai.anthropic.chat.max-tokens=4000
spring.ai.anthropic.chat.temperature=0.5

# No spring.datasource.url: Boot generates a unique in-memory H2 database per test context,
# which keeps concurrently cached contexts from dropping each other's tables.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

chat.context-window-size=0
chat.default-title=New chat
chat.title-max-length=60

spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=10s

# Keep tests deterministic and quiet: no OTLP export attempts against localhost.
# Micrometer falls back to a SimpleMeterRegistry, which the audit tests assert against.
# TestClaudePersonalAssistantApplication turns all three back on for spring-boot:test-run, which
# runs from this classpath and needs the export these lines suppress.
# The logs switch is management.logging.export.otlp.enabled in Boot 4: the older
# management.otlp.logging.export.enabled is deprecated at level=error, so it no longer binds and
# left log export running while it looked disabled.
management.otlp.metrics.export.enabled=false
management.tracing.export.enabled=false
management.logging.export.otlp.enabled=false
# The three switches above are not enough, and the claim that OpenTelemetry is off in tests was
# simply false without this line: OpenTelemetryLoggingAutoConfiguration is gated on
# @ConditionalOnEnabledOpenTelemetry (management.opentelemetry.enabled, matchIfMissing=true), not on
# the logging-export switch, and its SdkLoggerProvider needs only @ConditionalOnBean(Resource.class).
# So in EVERY cached Spring test context the bridge attached to the JVM-global Logback root logger
# and converted every line of every test into a LogRecord pushed through a live
# BatchLogRecordProcessor — batching threads and garbage for output that ends in a Noop exporter.
# TestClaudePersonalAssistantApplication turns this back on for spring-boot:test-run.
management.opentelemetry.enabled=false
