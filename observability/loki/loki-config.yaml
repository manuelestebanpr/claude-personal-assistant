# Verbatim copy of /otel-lgtm/loki-config.yaml as shipped by grafana/otel-lgtm:latest, plus the
# two blocks at the bottom. Re-sync it against the image whenever the image tag is bumped —
# mounting a stale copy over the image's own file silently reverts any upstream Loki config change:
#   podman run --rm --entrypoint sh docker.io/grafana/otel-lgtm:latest -c "cat /otel-lgtm/loki-config.yaml"
#
# Why it is mounted at all: the image ships no limits_config and no compactor, so the effective
# configuration is retention_period 0s (= keep forever) with retention_enabled false. Chunks under
# /data/loki/chunks are never deleted and the lgtm-data volume grows without bound; the failure
# shows up as a full disk months later, with no telemetry pointing at Loki as the cause. Because
# retention_enabled defaults to false, setting retention_period on its own would change nothing —
# the compactor is the component that actually deletes, so both blocks are required.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false

# --- Added by this project: bounded retention. Everything above is the image's file. ---

limits_config:
  # 31 days. Long enough to look back at a problem reported "last month", short enough that the
  # volume reaches a steady size instead of growing for the life of the machine.
  retention_period: 744h

compactor:
  working_directory: /data/loki/compactor
  # The switch that makes retention_period mean anything: with this false (the default) Loki
  # computes retention and then deletes nothing.
  retention_enabled: true
  # Required once retention_enabled is true — the compactor refuses to start without a delete
  # request store, and it must match the filesystem object_store configured above.
  delete_request_store: filesystem
