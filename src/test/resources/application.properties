spring.application.name=claude-personal-assistant

# This file shadows src/main/resources/application.properties (test-classes precedes classes on
# the classpath, and Boot takes the first classpath:/application.properties it finds) rather than
# merging with it, so everything the app needs must be reachable from here. The shared telemetry
# tuning is imported; the export switches below stay off for JUnit and are turned back on by
# TestClaudePersonalAssistantApplication for spring-boot:test-run.
spring.config.import=classpath:observability.properties

# Dummy key so the Anthropic auto-configuration can bootstrap without a real credential.
spring.ai.anthropic.api-key=test-api-key
spring.ai.anthropic.chat.model=claude-haiku-4-5
spring.ai.anthropic.chat.max-tokens=4000
spring.ai.anthropic.chat.temperature=0.5

# No spring.datasource.url: Boot generates a unique in-memory H2 database per test context,
# which keeps concurrently cached contexts from dropping each other's tables.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

chat.context-window-size=0
chat.default-title=New chat
chat.title-max-length=60

spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=10s

# Keep tests deterministic and quiet: no OTLP export attempts against localhost.
# Micrometer falls back to a SimpleMeterRegistry, which the audit tests assert against.
# TestClaudePersonalAssistantApplication turns all three back on for spring-boot:test-run, which
# runs from this classpath and needs the export these lines suppress.
# The logs switch is management.logging.export.otlp.enabled in Boot 4: the older
# management.otlp.logging.export.enabled is deprecated at level=error, so it no longer binds and
# left log export running while it looked disabled.
management.otlp.metrics.export.enabled=false
management.tracing.export.enabled=false
management.logging.export.otlp.enabled=false
