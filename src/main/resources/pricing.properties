# Anthropic list prices, in USD per MILLION tokens. This is the only file to edit when prices
# change; nothing multiplies tokens by money in Java.
#
# Why it is its own file, imported by both application.properties files rather than living in
# either: src/test/resources/application.properties SHADOWS src/main/resources/application.properties
# (target/test-classes precedes target/classes and Boot takes the first classpath:/application
# .properties it finds), so a price written in the main file would be invisible to
# `./mvnw spring-boot:test-run` — which is the mode whose entire purpose is a populated Grafana.
# observability.properties solves the same problem for telemetry tuning; this is the third such
# import, kept separate from it because "where do I update prices" should not be a search through
# 150 lines of exporter commentary.
#
# ---------------------------------------------------------------------------------------------
# TODO: fill these in from https://www.anthropic.com/pricing
# ---------------------------------------------------------------------------------------------
# Left at 0.0 deliberately. A zero renders as $0.00 and is obviously unset; a plausible but stale
# number renders as a believable figure and is not. Do not let anything guess these from memory.
#
# The four token types map onto the metric's gen_ai_token_type label values:
#   input        uncached input tokens        (billed at the standard input rate)
#   output       output tokens
#   cache-write  cache_creation_input_tokens  (Anthropic's 5m cache write rate)
#   cache-read   cache_read_input_tokens      (Anthropic's cache hit rate)
# cache-write and cache-read are always zero-volume today: prompt caching is off (Spring AI's
# AnthropicCacheOptions defaults to AnthropicCacheStrategy.NONE and nothing overrides it), verified
# live in AnthropicTokenAccountingVerificationTest. They are listed so enabling caching later is a
# price edit, not a code change.
#
# ---------------------------------------------------------------------------------------------
# The key is the model Anthropic RETURNS, not the alias this app requests.
# ---------------------------------------------------------------------------------------------
# application.properties asks for the moving alias `claude-haiku-4-5`; a live response resolves it
# to the dated snapshot below, and the dated form is what lands on the gen_ai_response_model label
# the cost query joins on. Keying this by the alias produces a gauge that matches no counter and a
# dashboard of empty panels. Confirm the current value after any model change by reading
# ChatResponse.getMetadata().getModel() — AnthropicTokenAccountingVerificationTest prints it.
#
# Bracket notation is required rather than stylistic: an unbracketed map key goes through the
# relaxed binder, which normalises dashes and would not round-trip a model id verbatim. Same reason
# management.opentelemetry.resource-attributes[service.instance.id] is written that way.
app.llm.pricing.prices[claude-haiku-4-5-20251001].input=0.0
app.llm.pricing.prices[claude-haiku-4-5-20251001].output=0.0
app.llm.pricing.prices[claude-haiku-4-5-20251001].cache-write=0.0
app.llm.pricing.prices[claude-haiku-4-5-20251001].cache-read=0.0
