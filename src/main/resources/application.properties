spring.application.name=claude-personal-assistant

# --- Secrets: .env is git-ignored, ship .env.example instead ---
spring.config.import=optional:file:.env[.properties]

# --- Anthropic / Spring AI ---
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.model=claude-haiku-4-5
spring.ai.anthropic.chat.max-tokens=4000
spring.ai.anthropic.chat.temperature=0.5
# SDK-internal retries; spring.ai.retry.* does not apply to Anthropic in Spring AI 2.0
spring.ai.anthropic.max-retries=3
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.chat.observations.include-error-logging=true

# --- Persistence (file-based H2, survives restarts) ---
# ddl-auto=update is mandatory: file H2 is not "embedded" to Boot, so the default would be
# none; update also creates Spring Modulith's EVENT_PUBLICATION table.
# No AUTO_SERVER: H2 2.x rejects it alongside DB_CLOSE_ON_EXIT=FALSE (mixed mode needs the JVM
# shutdown hook to deregister its server), and it buys nothing here — one process owns the file
# and the /h2-console runs in-process.
spring.datasource.url=jdbc:h2:file:./data/chat;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# --- Modulith events ---
spring.modulith.events.republish-outstanding-events-on-restart=true
# Explicit rather than relying on the upstream default: keeps a queryable audit trail of
# completed publications (vs delete/archive), which suits this low-volume app.
spring.modulith.events.completion-mode=update
# Surfaces a publication stuck in PROCESSING (e.g. a hung listener) via logs/metrics without
# waiting for a restart to trigger the republish setting above.
spring.modulith.events.staleness.processing=10m

# --- Observability export ---
# Boot samples 10% of traces by default, which leaves Tempo looking empty on a single-user app.
management.tracing.sampling.probability=1.0
# The 1m default means no metric renders for a full minute after boot; 15s keeps the dashboards
# responsive without meaningfully more traffic at this volume.
management.otlp.metrics.export.step=15s
# Timers publish only count/sum unless a histogram is requested, which would leave every latency
# panel (ours and the ones the otel-lgtm image ships) empty.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.app.module.operation=true
management.metrics.distribution.percentiles-histogram.mcp.tool=true
# Endpoints come from the OTEL_EXPORTER_OTLP_* env vars set in compose.yaml: Boot's
# OpenTelemetryEnvironmentVariableEnvironmentPostProcessor maps them onto management.* and appends
# the per-signal path (v1/metrics, v1/traces, v1/logs).
# Logs only reach the exporter because audit.logging.OpenTelemetryLoggingBridge installs an
# appender — Boot auto-configures the OTLP log pipeline but ships no Logback appender.

# --- Chat tunables ---
# 0 = send the full chat history as model context; a positive value caps to the last N messages
chat.context-window-size=0
chat.default-title=New chat
chat.title-max-length=60

# --- Streaming over the servlet OutputStream ---
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=5m
