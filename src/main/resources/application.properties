spring.application.name=claude-personal-assistant

# --- Secrets: .env is git-ignored, ship .env.example instead ---
# observability.properties and pricing.properties are imported rather than inlined so the test
# classpath can pull in the same telemetry tuning and the same Anthropic prices; see the header of
# each for why neither can live here.
spring.config.import=optional:file:.env[.properties],classpath:observability.properties,classpath:pricing.properties

# --- Anthropic / Spring AI ---
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.model=claude-haiku-4-5
spring.ai.anthropic.chat.max-tokens=4000
spring.ai.anthropic.chat.temperature=0.5
# max-retries and the chat observation switches live in observability.properties: they are
# run-mode agnostic, and the test classpath shadows this file rather than merging with it, so
# spring-boot:test-run would otherwise run without them.

# --- MCP servers this application connects to as a client ---
# Left unset, one entry is assumed: our own /mcp endpoint over loopback, id "local". Listing any
# server explicitly replaces that default, so include the local one if you still want it.
# Ours speaks revision 2026-07-28 (protocol=STATELESS: no initialize, no session). Most
# third-party servers still speak the session transport — use protocol=SESSION for those.
# Indices must stay contiguous from 0: Spring Boot's indexed-list binder (IndexedElementsBinder)
# binds servers[0], then [1], then [2]… and stops at the FIRST missing index — it never looks
# past a gap. Leaving [0] commented out while [1]/[2] are active silently binds NOTHING, with no
# error: the whole servers() list falls back to the single local default and the later entries
# are dropped. Uncomment or renumber the whole block together, never just a suffix of it.
mcp.servers[0].id=local
mcp.servers[0].name=Claude Personal Assistant
mcp.servers[0].base-url=http://localhost:8080
mcp.servers[0].endpoint=/mcp
mcp.servers[0].protocol=STATELESS
# Google's own remote Gmail/Calendar MCP servers. Verified reachable and protocol-correct — an
# unauthenticated initialize returns 200 with serverInfo {"name":"StatelessServer","version":"ESF"},
# and sending 2026-07-28 instead of 2025-11-25 is rejected with -32600, so SESSION below is right.
# They are switched off because they are gated behind the Google Workspace Developer Preview
# Program: it is approval-based and requires a Google Workspace account, which this consumer
# account is not. Their frontend (ESF) returns the full tools/list body regardless of auth and
# encodes the verdict in the HTTP status alone — 200 with no token, 401 with a bad one, 403 with a
# valid token that is not authorised — so leaving these enabled costs a failed round trip on every
# picker open and two permanently unreachable rows in the UI.
# Enabling them needs BOTH the ordinary API and a separate MCP service in the Cloud project
# (gmailmcp.googleapis.com, calendarmcp.googleapis.com), not just a scope: the "gmailmcp" name is a
# service to enable, never an OAuth scope. Until then the equivalent capability is served by the
# local tools in mcp/domain/tool/google, which call the ordinary Gmail and Calendar REST APIs and
# need no preview access.
# Re-enabling is uncommenting this block — but uncomment it whole. Spring Boot's indexed-list
# binder stops at the first missing index, so a half-uncommented block silently binds nothing.
#mcp.servers[1].id=gmail-mcp
#mcp.servers[1].name=Gmail
#mcp.servers[1].base-url=https://gmailmcp.googleapis.com
#mcp.servers[1].endpoint=/mcp/v1
#mcp.servers[1].protocol=SESSION
#mcp.servers[1].google-auth=true
#mcp.servers[2].id=calendar-mcp
#mcp.servers[2].name=Calendar
#mcp.servers[2].base-url=https://calendarmcp.googleapis.com
#mcp.servers[2].endpoint=/mcp/v1
#mcp.servers[2].protocol=SESSION
#mcp.servers[2].google-auth=true

# --- Google Workspace OAuth (Gmail + Calendar tools) ---
# Off unless .env supplies credentials, so the app boots — and the test suite runs — with none.
# Authenticates through a dedicated OAuth client registered for this purpose — its own redirect
# URI, not the https://claude.ai/api/mcp/auth_callback one Google's docs mention for claude.ai's
# own connector, which this app cannot receive. Single user, so a single refresh token obtained
# once out of band stands in for a login flow; GoogleAccessTokens exchanges it for a short-lived
# access token and caches that until it is nearly spent.
# .env must hold the REFRESH token, not an access token: the grant is grant_type=refresh_token, and
# an access token dies in about an hour with no way to renew it.
# Scopes needed by the local tools: gmail.readonly, gmail.compose, and — because calendar_create/
# update/delete_event write — https://www.googleapis.com/auth/calendar.events. A read-only calendar
# scope lists events fine and fails every mutation with HTTP 403.
# A consent screen left in "Testing" expires the refresh token after 7 days; publishing the app is
# what stops it needing to be re-minted weekly.
# These same credentials also serve an mcp.servers[].google-auth=true entry, which is how Google's
# remote MCP servers would be reached if preview access ever arrives — see the block above.
google.workspace.enabled=${GOOGLE_WORKSPACE_ENABLED:false}
google.workspace.client-id=${GOOGLE_CLIENT_ID:}
google.workspace.client-secret=${GOOGLE_CLIENT_SECRET:}
google.workspace.refresh-token=${GOOGLE_REFRESH_TOKEN:}

# --- Persistence (file-based H2, survives restarts) ---
# ddl-auto=update is mandatory: file H2 is not "embedded" to Boot, so the default would be
# none; update also creates Spring Modulith's EVENT_PUBLICATION table.
# No AUTO_SERVER: H2 2.x rejects it alongside DB_CLOSE_ON_EXIT=FALSE (mixed mode needs the JVM
# shutdown hook to deregister its server), and it buys nothing here — one process owns the file
# and the /h2-console runs in-process.
spring.datasource.url=jdbc:h2:file:./data/chat;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# --- Modulith events ---
spring.modulith.events.republish-outstanding-events-on-restart=true
# Explicit rather than relying on the upstream default: keeps a queryable audit trail of
# completed publications (vs delete/archive), which suits this low-volume app.
spring.modulith.events.completion-mode=update
# Surfaces a publication stuck in PROCESSING (e.g. a hung listener) via logs/metrics without
# waiting for a restart to trigger the republish setting above.
spring.modulith.events.staleness.processing=10m

# --- Observability export ---
# Sampling, export step and histogram buckets live in observability.properties, imported above.
# Endpoints come from the OTEL_EXPORTER_OTLP_* env vars set in compose.yaml: Boot's
# OpenTelemetryEnvironmentVariableEnvironmentPostProcessor maps them onto management.* and appends
# the per-signal path (v1/metrics, v1/traces, v1/logs). It registers that mapping with addFirst(),
# so under compose the env var still wins over the two defaults below.
# Logs only reach the exporter because audit.logging.OpenTelemetryLoggingBridge installs an
# appender — Boot auto-configures the OTLP log pipeline but ships no Logback appender.
#
# Traces and logs need an explicit endpoint or they export nowhere, silently. Boot 4.1 gives them
# no default at all: OtlpLoggingProperties and OtlpTracingProperties declare a @Nullable endpoint,
# their ConnectionDetails beans are @ConditionalOnProperty on that endpoint, and the exporters are
# @ConditionalOnBean on those — so under plain `./mvnw spring-boot:run` the SdkLoggerProvider is
# still built, the bridge still attaches, 100% of spans are still recorded, and all of it lands in
# a NoopExporter with no ConnectException and no warning to read. Metrics look fine only because
# OtlpConfig hardcodes http://localhost:4318/v1/metrics, which is why the failure reads as "traces
# and logs are broken" rather than "no endpoint configured".
# Setting OTEL_EXPORTER_OTLP_ENDPOINT in .env does NOT fix it: Boot's OpenTelemetryEnvironmentVariables
# reads System::getenv, never the Spring Environment that spring.config.import=optional:file:.env
# feeds, so a .env entry is invisible to the post-processor. Override with a real env var or with
# the OTEL_TRACES_ENDPOINT / OTEL_LOGS_ENDPOINT placeholders below.
# These two lines are deliberately here and not in observability.properties: spring-boot:test-run
# reads the test classpath, so it never sees this file and keeps taking its endpoints from the
# Testcontainers @ServiceConnection. Even if it did read them, @ServiceConnection would still win —
# it contributes the ConnectionDetails bean and the properties-backed one is @ConditionalOnMissingBean.
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# --- Chat tunables ---
# 0 = send the full chat history as model context; a positive value caps to the last N messages
chat.context-window-size=0
chat.default-title=New chat
chat.title-max-length=60

# --- Streaming over the servlet OutputStream ---
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=5m
