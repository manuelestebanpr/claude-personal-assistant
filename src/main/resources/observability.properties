# Telemetry tuning shared by every way of running the app.
#
# It lives outside application.properties because src/test/resources/application.properties
# *shadows* the main one rather than merging with it: target/test-classes precedes
# target/classes on the classpath and Boot resolves classpath:/application.properties to the
# first match only. So spring-boot:test-run — the mode whose entire purpose is a Grafana full of
# this application's telemetry — silently ran on defaults. Both application.properties files
# import this file, so the settings below cannot drift between run modes.
#
# Each line here exists because its default silently produces an empty or wrong Grafana.

# Boot samples 10% of traces by default, which leaves Tempo looking broken on a single-user app.
management.tracing.sampling.probability=1.0

# The 1m default means no metric renders for a full minute after boot; 15s keeps the dashboards
# responsive without meaningfully more traffic at this volume.
management.otlp.metrics.export.step=15s

# Timers publish a single +Inf bucket unless a histogram is requested. Measured: 69 buckets with
# these lines, 1 without — histogram_quantile() over one bucket is not empty, it is meaningless,
# so every p95 panel (ours and the ones the otel-lgtm image ships) quietly reads nonsense.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.app.module.operation=true
management.metrics.distribution.percentiles-histogram.mcp.tool=true
