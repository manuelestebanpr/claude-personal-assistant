# Copied VERBATIM from grafana/otel-lgtm:latest (/otel-lgtm/prometheus.yaml) and extended with the
# rule_files block at the bottom — nothing above it is ours.
#
# Why the whole file rather than a fragment: Prometheus has no --rules.file flag and no include
# mechanism, so rule_files can only be added by replacing the config, and the image ships no
# rule_files entry of its own. run-prometheus.sh passes --config.file=./prometheus.yaml, so
# overwriting that path is the only hook. Same trade already accepted for loki-config.yaml.
#
# The cost: everything above is a snapshot of one image version. If the image changes its OTLP
# promote_resource_attributes list, this copy pins the old one — and service.instance.id in
# particular is load-bearing (observability.properties sets it precisely so the Prometheus
# 'instance' label is not empty). After a `podman pull grafana/otel-lgtm:latest`, diff this file
# against the image's copy:
#   podman run --rm --entrypoint sh docker.io/grafana/otel-lgtm:latest -c 'cat /otel-lgtm/prometheus.yaml' \
#     | diff - observability/prometheus/prometheus.yaml
---
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m

# --- Added by this project ---
# The LLM spend recording rules. The path is inside the container; compose.yaml and
# TestcontainersConfiguration both mount observability/prometheus/llm-cost-rules.yaml there.
rule_files:
  - /otel-lgtm/llm-cost-rules.yaml
